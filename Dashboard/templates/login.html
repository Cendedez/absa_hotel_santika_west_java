<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Login internal Dashboard ABSA Hotel Santika">
    <title>Login - Dashboard ABSA Hotel Santika</title>
    <link rel="stylesheet" href="/static/css/style.css?v=20260605-login-clean">
</head>
<body class="auth-page">
    <main class="auth-shell">
        <section class="auth-brief">
            <div class="auth-brand">
                <div class="auth-brand-mark">
                    <img class="auth-logo-img" src="{{ url_for('static', filename='img/hotel-santika-logo.png') }}?v=20260605" alt="Hotel Santika Logo">
                </div>
            </div>
            <div class="auth-copy">
                <h1>Selamat Datang di Customer Sentiment Dashboard Hotel Santika Jawa Barat</h1>
                <p>
                    Silakan masuk untuk mengakses analisis kepuasan tamu dan ringkasan sentimen pelanggan.
                </p>
            </div>
        </section>


        <section class="auth-card">
            <div class="auth-card-header">
                <div>
                    <h2>Masuk ke Dashboard</h2>
                    <p>Masukkan ID Pengguna dan Kata Sandi Anda.</p>
                </div>
            </div>

            {% if error %}
            <div class="auth-alert">{{ error }}</div>
            {% endif %}

            <form method="post" class="auth-form">
                <div class="form-group">
                    <label class="form-label" for="username">ID Pengguna</label>
                    <input class="form-input" id="username" name="username" type="text" autocomplete="username" required autofocus>
                </div>
                <div class="form-group">
                    <label class="form-label" for="password">Kata Sandi</label>
                    <input class="form-input" id="password" name="password" type="password" autocomplete="current-password" required>
                </div>
                <button class="btn btn-primary auth-submit" type="submit">Masuk</button>
            </form>


        </section>
    </main>
</body>
</html>
